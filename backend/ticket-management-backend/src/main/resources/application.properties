spring.application.name=ticket-management-backend
server.port=8080
#server.servlet.context-path=/identity

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/ticket_db
spring.datasource.username=postgres
spring.datasource.password=123123
spring.datasource.driver-class-name=org.postgresql.Driver
# -> Muốn kết nối PostgreSQL thì dùng PostgreSQL JDBC Driver.

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# URL của realm bạn vừa tạo trong Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ticket_management_realm

# (Tuỳ chọn) URL lấy public key certificate để decode và verify JWT từ Keycloak
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/ticket_management_realm/protocol/openid-connect/certs

# Cấu hình Keycloak Admin Client (Để tạo User tự động)
keycloak.auth-server-url=http://localhost:8081
keycloak.realm=ticket_management_realm
keycloak.client-id=ticket-app
