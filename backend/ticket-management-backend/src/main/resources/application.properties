spring.application.name=ticket-management-backend
server.port=8080
#server.servlet.context-path=/identity

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/ticket_db
spring.datasource.username=postgres
spring.datasource.password=123123
spring.datasource.driver-class-name=org.postgresql.Driver
# -> Muốn kết nối PostgreSQL thì dùng PostgreSQL JDBC Driver.

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
