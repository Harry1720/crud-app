<h2>Create User</h2>

<input
  type="text"
  placeholder="Username"
  [(ngModel)]="username"
/>

<input
  type="text"
  placeholder="Full Name"
  [(ngModel)]="fullName"
/>

<input
  type="text"
  placeholder="Password"
  [(ngModel)]="password"
/>

<!-- Biến user này : trong file user-form.ts bằng dòng code:
@Input() user: any = null; -->
@if(user){
  <button (click)="updateUser()">
    Update
  </button>
}
@if(!user){
  <button (click)="createUser()">
    Create
  </button>
}
